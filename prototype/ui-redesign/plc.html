<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MongoMation Tabs Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Light control-room theme (ISA-101: neutral gray plant, color only for state) */
:root{
  --bg:#f1f0ec;--surface:#ffffff;--sunk:#f7f6f2;--sunk2:#efede8;--line:#e3e0d9;--line2:#cfcbc2;
  --ink:#1b2127;--ink2:#3f4952;--ink3:#67717b;--ink4:#9aa1a8;
  --go:#13804a;--go-bg:#e4f3ea;--go-line:#a9d9bd;
  --stop:#c0322b;--stop-bg:#fbe8e6;--stop-line:#efb4ae;
  --ca:#9a5c00;--ca-bg:#fdf0d5;--ca-line:#f0cf87;--ca-fill:#f2b01e;
  --fl:#0a6fa3;--fl-bg:#e2f1f9;--fl-line:#a7d3ea;
  --me:#5b40c9;--me-bg:#eeeafc;--me-line:#c7bcf3;
  --leaf:#00684a;--leaf2:#00a35c;--leaf-bg:#e5f4ec;
  --sensor:#2f6fca;--actuator:#c4501c;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--sans:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgb(27 33 39/.06),0 8px 24px -12px rgb(27 33 39/.14);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
html{color-scheme:light}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(to right,rgb(27 33 39/.035) 1px,transparent 1px),linear-gradient(to bottom,rgb(27 33 39/.035) 1px,transparent 1px);background-size:28px 28px}
button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
.mock{font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ca);text-align:center;padding:6px 16px;background:repeating-linear-gradient(-45deg,var(--ca-bg) 0 10px,#fbf6ea 10px 20px);border-bottom:1px solid var(--ca-line)}

/* ---------- header + tabs ---------- */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:28px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--display);color:var(--ink);background:none;border:0;padding:0;flex:none}
.brand b{color:var(--leaf2)}
.tabs{display:flex;align-items:stretch;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;font:600 12.5px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover:not([disabled]){color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--leaf2)}
.tab[disabled]{color:var(--ink4);cursor:not-allowed}
.tab .lk{width:10px;height:10px;opacity:.7}
.tab .nd{width:7px;height:7px;border-radius:50%;background:var(--fl)}
.tab .nd.red{background:var(--stop)} .tab .nd.me{background:var(--me)}
.lamps{margin-left:auto;display:flex;gap:14px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);flex:none}
.lamps span{display:flex;align-items:center;gap:6px}
.lamp{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px var(--go-bg)}
.lamp.warn{background:var(--ca-fill);box-shadow:0 0 0 3px var(--ca-bg)} .lamp.bad{background:var(--stop);box-shadow:0 0 0 3px var(--stop-bg)}

/* run bar */
.runbar{border-bottom:1px solid var(--line);background:var(--sunk)}
.runbar .in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px}
.spec{flex:0 1 330px;min-width:0}
.spec .k{font:600 10px var(--display);text-transform:uppercase;letter-spacing:.16em;color:var(--ink4)}
.spec .q{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{flex:1;display:flex;align-items:center;gap:0;min-width:0}
.sn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink4);white-space:nowrap}
.sn:not([disabled]):hover{background:var(--sunk2)}
.sn[disabled]{cursor:default}
.sn .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--surface);font:600 11px var(--mono);transition:all .3s}
.sn .t{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.08em}
.sn .s{font:400 10.5px var(--mono);color:var(--ink4)}
.sn.active{color:var(--ink)} .sn.active .c{border-color:var(--fl);color:var(--fl);animation:ring 1.6s ease-in-out infinite} .sn.active .s{color:var(--fl)}
.sn.done{color:var(--ink2)} .sn.done .c{border-color:var(--go);background:var(--go);color:#fff}
.sn.warn .c{border-color:var(--ca-fill);background:var(--ca-bg);color:var(--ca)} .sn.warn{color:var(--ink)} .sn.warn .s{color:var(--ca)}
.sn.paused .c{border-color:var(--stop);color:var(--stop);animation:none}
.conn{flex:1;min-width:12px;height:2px;background:var(--line2);border-radius:2px;position:relative;overflow:hidden}
.conn i{position:absolute;inset:0;width:0;background:var(--go);transition:width .5s}
.follow{flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);font:500 11.5px var(--mono);color:var(--ink3)}
.follow.on{border-color:var(--fl-line);background:var(--fl-bg);color:var(--fl)}
.follow .d{width:7px;height:7px;border-radius:50%;background:var(--ink4)}
.follow.on .d{background:var(--fl);animation:pulse 1.4s ease-in-out infinite}

/* ---------- layout ---------- */
main{max-width:1320px;margin:0 auto;padding:22px 24px 64px}
.pane{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h2,.ch h3{margin:0;font:600 13px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}
.ch .sub{font:400 12px var(--mono);color:var(--ink3)}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.cb{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.g-side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.g-left{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.lbl{font:600 10.5px var(--display);text-transform:uppercase;letter-spacing:.16em;color:var(--ink3);margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.go{color:var(--go);background:var(--go-bg);border-color:var(--go-line)}
.pill.stop{color:var(--stop);background:var(--stop-bg);border-color:var(--stop-line)}
.pill.ca{color:var(--ca);background:var(--ca-bg);border-color:var(--ca-line)}
.pill.fl{color:var(--fl);background:var(--fl-bg);border-color:var(--fl-line)} .pill.fl i{animation:pulse 1.4s ease-in-out infinite}
.pill.me{color:var(--me);background:var(--me-bg);border-color:var(--me-line)}
.pill.nt{color:var(--ink3);background:var(--sunk);border-color:var(--line2)}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:48px 20px;text-align:center;color:var(--ink3);background:var(--sunk)}
.empty b{display:block;font:600 13px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 12px var(--display);text-transform:uppercase;letter-spacing:.1em;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--sunk);border-color:var(--ink4)} .btn:active{transform:translateY(1px)}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:#fff} .btn.pri:hover{background:#005a40}
.btn.hz{border-color:var(--ca-line);background:var(--ca-bg);color:var(--ca);position:relative;overflow:hidden}
.btn.hz::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(-45deg,var(--ca-fill) 0 6px,transparent 6px 12px)}
.btn.red{border-color:var(--stop-line);background:var(--stop-bg);color:var(--stop)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;font-size:11px;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:3px;background:var(--sunk);gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 12px;font:500 12.5px var(--sans);color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg button:hover:not(.on){color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--mono);font-size:12px;color:var(--ink2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)} tr.sel td{background:var(--fl-bg)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d5d8db;box-shadow:inset 0 0 0 1px rgb(0 0 0/.12)}
.led.on{background:var(--go);box-shadow:0 0 0 3px var(--go-bg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.kv span:first-child{color:var(--ink3)}
.metric{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px}
.metric .k{font:600 10px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--ink3)}
.metric .v{font:500 24px/1.2 var(--mono);margin-top:4px}
.metric .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.t-go{color:var(--go)} .t-stop{color:var(--stop)} .t-ca{color:var(--ca)} .t-me{color:var(--me)} .t-fl{color:var(--fl)}

/* ---------- build: hero ---------- */
.hero{max-width:860px;margin:6vh auto 0}
.kicker{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.22em;color:var(--leaf2)}
h1{font:700 clamp(32px,5vw,50px)/1.06 var(--display);letter-spacing:-.01em;margin:12px 0 12px}
h1 em{font-style:normal;color:var(--leaf)}
.lede{font-size:16px;line-height:1.6;color:var(--ink2);margin:0 0 28px;max-width:640px}
.composer{background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px -24px rgb(27 33 39/.3);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--leaf2);box-shadow:0 0 0 4px var(--leaf-bg),0 18px 40px -24px rgb(27 33 39/.3)}
.composer textarea{display:block;width:100%;min-height:128px;resize:vertical;border:0;background:transparent;padding:18px 20px 8px;font-size:15.5px;line-height:1.6;color:var(--ink);outline:none}
.composer textarea::placeholder{color:var(--ink4)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 12px 12px 18px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 12px 12px}
.cbar select{background:var(--surface);border:1px solid var(--line2);border-radius:6px;height:30px;padding:0 8px;font:400 12px var(--mono);color:var(--ink2)}
.gen{margin-left:auto}
.gen.nudge{animation:nudge 1s ease-in-out 2}
.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ex{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.ex:hover{border-color:var(--leaf2);transform:translateY(-2px);box-shadow:var(--shadow)}
.ex .t{display:flex;align-items:center;gap:9px;font:600 14px var(--display);letter-spacing:.02em}
.ex .t svg{flex:none;color:var(--leaf2)}
.ex p{margin:6px 0 10px;font-size:13px;line-height:1.5;color:var(--ink2)}
.ex .m{font:400 11px var(--mono);color:var(--ink4)}

/* build: steps */
.reqs{display:flex;flex-direction:column;gap:8px}
.req{display:grid;grid-template-columns:30px 1fr;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45;color:var(--ink2);animation:rise .35s both}
.req b{font:500 11px var(--mono);color:var(--ink3);padding-top:2px}
.sf{display:inline-block;margin-left:6px;font:500 9.5px var(--mono);text-transform:uppercase;color:var(--ca);border:1px solid var(--ca-line);background:var(--ca-bg);border-radius:3px;padding:1px 4px;vertical-align:1px}
.editor{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfbf9}
.etabs{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font:400 11.5px var(--mono);color:var(--ink3);background:var(--sunk)}
.etabs .f{color:var(--ink);font-weight:500}
.etabs .r{margin-left:auto}
.code{font:400 12.5px/1.7 var(--mono);padding:10px 0;height:440px;overflow:auto;color:var(--ink)}
.ln{display:grid;grid-template-columns:46px 1fr;white-space:pre}
.ln>b{font-weight:400;color:var(--ink4);text-align:right;padding-right:14px;user-select:none}
.ln.hw{background:var(--leaf-bg);animation:flash 1.2s ease-out}
.ln.add{background:var(--go-bg)} .ln.add>b{color:var(--go)}
.ln.del{background:var(--stop-bg);color:var(--stop);text-decoration:line-through}
.caret{display:inline-block;width:7px;height:15px;background:var(--fl);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.kw{color:#2149b8;font-weight:500}.ty{color:#0a6fa3}.cm{color:#8a9198;font-style:italic}.ad{color:var(--leaf);font-weight:600}.nu{color:#a35400}
.note{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.note .sq{width:12px;height:12px;border-radius:3px;background:var(--leaf-bg);border:1px solid var(--go-line);flex:none}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.cn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:12px;transition:all .3s}
.cn .k{font:600 10px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--ink3)}
.cn .v{margin-top:4px;font:500 13px var(--mono);color:var(--ink3)}
.cn.on{border-color:var(--go-line);background:var(--go-bg)} .cn.on .v{color:var(--go)}
.cn.busy{border-color:var(--fl-line);background:var(--fl-bg)} .cn.busy .v{color:var(--fl)}
.term{border:1px solid var(--line);background:#fbfbf9;border-radius:8px;font:400 12.5px/1.8 var(--mono);padding:14px 16px;min-height:260px;max-height:420px;overflow:auto;color:var(--ink2)}
.term div{animation:rise .25s both;white-space:pre-wrap}
.term .ok{color:var(--go)} .term .dim{color:var(--ink4)} .term .hi{color:var(--fl)}
.checklist{display:flex;flex-direction:column;gap:7px}
.ci{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink4);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);transition:all .3s}
.ci .b{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.ci.doing{color:var(--ink);border-color:var(--fl-line);background:var(--fl-bg)} .ci.doing .b{border-color:var(--fl);border-top-color:transparent;animation:spin .8s linear infinite}
.ci.done{color:var(--ink2);background:var(--surface)} .ci.done .b{border-color:var(--go);background:var(--go)}
.ci.done .b::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.progress{height:5px;border-radius:5px;background:var(--sunk2);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;width:0;background:var(--fl);transition:width .4s}
.tests{display:flex;flex-direction:column;gap:6px}
.test{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink3);transition:all .3s}
.test .i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font:700 10px var(--mono);color:#fff}
.test.run{color:var(--ink);border-color:var(--fl-line);background:var(--fl-bg)} .test.run .i{border-color:var(--fl);border-top-color:transparent;animation:spin .8s linear infinite}
.test.pass{color:var(--ink)} .test.pass .i{border-color:var(--go);background:var(--go)}
.test.fail{color:var(--stop);border-color:var(--stop-line);background:var(--stop-bg)} .test.fail .i{border-color:var(--stop);background:var(--stop)}
.test.click{cursor:pointer} .test.click:hover{border-color:var(--ink4)} .test.sel{box-shadow:0 0 0 2px var(--fl-line)}
.test .rq{font:400 11px var(--mono);color:var(--ink4)}
.test .id{font:500 11px var(--mono);color:var(--ink4);margin-right:6px}
.repair{border:1px solid var(--me-line);background:var(--me-bg);border-radius:10px;padding:14px 16px;animation:rise .4s both}
.repair h3{margin:0 0 8px;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--me)}
.repair p{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--ink2)}
.diff{font:400 12px/1.7 var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 0;overflow:auto}
.diff div{padding:0 12px 0 24px;text-indent:-12px;white-space:pre-wrap;word-break:break-word}
.diff .p{background:var(--go-bg);color:var(--go)} .diff .m{background:var(--stop-bg);color:var(--stop)} .diff .c{color:var(--ink3)}
.done-hero{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--go-bg);border:2px solid var(--go);color:var(--go);animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both;flex:none}
.done-hero h2{margin:0;font:700 26px var(--display)}
.done-hero p{margin:4px 0 0;color:var(--ink2)}
.next{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- HMI ---------- */
.hmi{border:1px solid var(--line2);border-radius:10px;background:#e7e6e1;overflow:hidden}
.hmi-bar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:#d9d7d1;border-bottom:1px solid var(--line2);font:500 11.5px var(--mono);color:var(--ink2)}
.alarm{margin-left:auto;padding:4px 9px;border-radius:4px;border:1px solid var(--line2);background:#eceae5;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.alarm.on{border-color:var(--stop);background:var(--stop);color:#fff;animation:pulse 1s ease-in-out infinite}
.alarm.forced{border-color:var(--ca-fill);background:var(--ca-bg);color:var(--ca)}
.hmi svg{display:block;width:100%;height:auto}
.bld{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.bld.in{opacity:1;transform:none}
.hbtn{cursor:pointer} .hbtn:hover{filter:brightness(1.1)}
.belt{stroke-dasharray:4 10} .belt.run{animation:belt .5s linear infinite}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5;margin:12px 2px 0}

const TABS = [['build','Build'],['hmi','HMI'],['program','Program'],['verify','Verification'],['harness','Harness'],['log','Log']];

/* ================= shell ================= */
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => { const lock = !unlocked.has(k);
    return `<button class="tab ${tab===k?'on':''}" role="tab" ${lock?'disabled title="Unlocks as the run reaches it"':''} onclick="setTab('${k}',true)">${l}${lock?'<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>':''}${dots[k]&&tab!==k?`<span class="nd ${dots[k]==='red'?'red':dots[k]==='me'?'me':''}"></span>`:''}</button>`; }).join('');
}
function setTab(k, user){
  if (!unlocked.has(k)) return;
  if (user && S.started && !S.verified) setFollow(false);
  tab = k; dots[k] = null; renderTabs(); renderPane(); window.scrollTo({top:0});
}
function unlock(k){ if (!unlocked.has(k)){ unlocked.add(k); if (tab !== k) dots[k] = 'new'; renderTabs(); } }
function live(k){ if (follow && tab !== k){ tab = k; dots[k] = null; renderTabs(); renderPane(); } }
function touch(k, kind){ if (tab === k) renderPane(); else if (unlocked.has(k)){ if (kind || !dots[k]) dots[k] = kind || 'new'; renderTabs(); } }
function setFollow(on){ follow = on; $('#follow').classList.toggle('on', on); $('#followTxt').textContent = on ? 'Following live' : 'Follow live'; }
$('#follow').onclick = () => { setFollow(!follow); if (follow) live(STEP_TAB[S.cur] || 'build'); };
const STEP_TAB = ['build','build','hmi','verify','build'];

function renderRunbar(){
  $('#runbar').classList.toggle('hidden', !S.started);
  if (!S.started) return;
  $('#steps').innerHTML = STEPS.map((l,i) => { const st = PAUSED && S.status[i]==='active' ? 'paused' : S.status[i];
    const btn = `<button class="sn ${st}" ${st==='pending'?'disabled':''} onclick="jumpStep(${i})"><span class="c">${st==='done'?'✓':st==='warn'?'!':i+1}</span><span><span class="t">${l}</span><br><span class="s">${S.sub[i]||'&nbsp;'}</span></span></button>`;
    const conn = i < STEPS.length-1 ? `<span class="conn"><i style="width:${S.status[i]==='done'?100:0}%"></i></span>` : '';
    return btn + conn; }).join('');
}
function jumpStep(i){
  if (i === 0) { progSub = 'code'; setTab(S.cur===0 ? 'build' : 'program', true); }
  else if (i === 1) { progSub = 'compile'; setTab(S.cur===1 ? 'build' : 'program', true); }
  else setTab(['','', 'hmi','verify','build'][i], true);
}
function setStep(i, st, sub){ S.status[i] = st; if (sub !== undefined) S.sub[i] = sub; renderRunbar(); }

/* ================= panes ================= */
function renderPane(){ const m = $('#main'); m.innerHTML = `<div class="pane">${PANES[tab]()}</div>`; AFTER[tab] && AFTER[tab](); }
const PANES = {}, AFTER = {};

function hl(l){
  return l.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/(\(\*.*?\*\))/g,'<span class="cm">$1</span>')
    .replace(/(%Q[XW][\d.]+)/g,'<span class="ad">$1</span>')
    .replace(/\b(PROGRAM|END_PROGRAM|VAR|END_VAR|AT|IF|THEN|END_IF|AND|OR|NOT|TRUE|FALSE)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(BOOL|TON)\b/g,'<span class="ty">$1</span>').replace(/(T#\d+s)/g,'<span class="nu">$1</span>');
}
const codeHtml = (lines, caret) => lines.map((l,i) => `<div class="ln ${l.c||''}"><b>${i+1}</b><span>${hl(l.t)}${caret && i===lines.length-1?'<span class="caret"></span>':''}</span></div>`).join('');
function paintCode(caret){
  for (const id of ['#code','#pcode']){ const el = $(id); if (!el) continue; el.innerHTML = codeHtml(S.code, caret); el.scrollTop = el.scrollHeight; }

const editor = (id, title) => `<div class="editor"><div class="etabs"><span class="f">main.st</span><span>${title}</span><span class="r" id="lineCount">${S.code.length?S.code.length+' lines':''}</span></div><div class="code" id="${id}"></div></div>

const termHtml = () => `<div class="term" id="term">${S.term.map(([c,t]) => `<div class="${c}">${t}</div>`).join('') || '<div class="dim">waiting for program…</div>'}</div>`;

let hmi = {running:false, fault:false, count:0, box:null, raf:0, jamT:0, forced:false, hint:'Live — buttons write to the PLC through Factory I/O. Press <b>START</b>.'};
function bindHmi(){
  const on = (id, fn) => { const n = document.getElementById(id); if (n) n.onclick = fn; };
  on('bStart', () => { if (!hmi.fault){ hmi.running = true; paintHmi(); } });
  on('bStop', () => { hmi.running = false; paintHmi(); });
  on('bEstop', () => { hmi.running = false; paintHmi(); });
  on('bReset', () => { if (!hmi.forced && hmi.fault){ hmi.fault = false; hmi.hint = 'Fault cleared. Press <b>START</b> to restart — the line does not restart by itself (R7).'; const h=$('#hmiHint'); if(h) h.innerHTML = hmi.hint; paintHmi(); } });
  paintHmi();
  if (!hmi.raf){ let last = performance.now(); const loop = now => { tickHmi((now-last)/1000); last = now; hmi.raf = requestAnimationFrame(loop); }; hmi.raf = requestAnimationFrame(loop); }
}
function tickHmi(dt){
  const box = document.getElementById('box');
  if (hmi.forced && hmi.running && !hmi.fault){ hmi.jamT += dt; if (hmi.jamT > 3){ hmi.fault = true; logEv('Left lane stopped after 3.0 s · Reset light latched (R6 holds under fault)'); paintHmi(); } }
  if (!box || !hmi.running || hmi.fault) return;
  if (!hmi.box) hmi.box = {x:40, y:168, tall:Math.random() > .5, ph:0};
  const b = hmi.box, v = 120 * dt;
  if (b.ph === 0){ b.x += v; if (b.x >= 394){ b.x = 394; b.ph = 1; } }
  else { b.y += b.tall ? v : -v; if (b.y > 340 || b.y < 30){ hmi.box = null; hmi.count++; const c = document.getElementById('cnt'); if (c) c.textContent = String(hmi.count).padStart(4,'0'); IO[23][3] = String(hmi.count); return; } }
  box.setAttribute('x', b.x); box.setAttribute('y', b.y); box.setAttribute('height', b.tall ? 30 : 18); box.setAttribute('opacity', 1);
  document.getElementById('sHigh').setAttribute('fill', b.ph===0 && b.x>300 && b.x<350 && b.tall ? '#FF5A1F' : '#c4c8cc');
  document.getElementById('sLow').setAttribute('fill', b.ph===0 && b.x>270 && b.x<320 ? '#FF5A1F' : '#c4c8cc');
}
function paintHmi(){
  const r = hmi.running, f = hmi.fault, run = r && !f, g = id => document.getElementById(id);
  IO.forEach(t => { if (['Conveyor entry','Conveyor left','Conveyor right'].includes(t[0])) t[3] = run?1:0; if (t[0]==='Start light') t[3] = r?1:0; if (t[0]==='Reset light') t[3] = f?1:0; if (t[0]==='At left exit') t[3] = hmi.forced?0:1; });
  if (!g('beltE')) return;
  ['beltE','beltL','beltR'].forEach(id => { g(id).classList.toggle('run', run); g(id).setAttribute('stroke', run ? '#0B0B0C' : '#a9aeb3'); });
  if (f) g('beltL').setAttribute('stroke', '#c0322b');
  const act = (id, on, txt) => { g(id).setAttribute('stroke', on ? '#FF5A1F' : '#a9aeb3'); g(id).setAttribute('fill', on ? '#FFF1EB' : '#f2f1ed'); g(id+'t').setAttribute('fill', on ? '#FF5A1F' : '#67717b'); g(id+'t').textContent = `${txt} ${on?'ON':'OFF'}`; };
  act('aE', run, 'ENTRY'); act('aL', run, 'LEFT'); act('aR', run, 'RIGHT');
  g('lStart').setAttribute('fill', r ? '#FF5A1F' : '#c4c8cc'); g('lReset').setAttribute('fill', f ? '#f2b01e' : '#c4c8cc'); g('lStop').setAttribute('fill', !r ? '#c0322b' : '#c4c8cc');
  g('sLExit').setAttribute('fill', hmi.forced ? '#f2b01e' : '#c4c8cc'); g('sRExit').setAttribute('fill', '#c4c8cc');
  const al = g('alarm'); al.className = 'alarm bld in' + (f ? ' on' : hmi.forced ? ' forced' : '');
  al.textContent = f ? 'ALARM · Left exit jam > 3 s' : hmi.forced ? 'Left exit eye forced blocked' : 'No active alarms';
  if (tab === 'program' && progSub === 'io') renderPane();
}
function injectFault(){
  const sel = $('#faultSel').value;
  if (sel !== 'left'){ S.faults.push([$('#faultSel').selectedOptions[0].text, 'handled']); logEv(`Fault injected: ${$('#faultSel').selectedOptions[0].text} · program reacted as specified`); renderPane(); return; }
  hmi.forced = true; hmi.running = true; hmi.jamT = 0; hmi.fault = false;
  hmi.hint = '<b style="color:var(--ca)">FORCED</b> — the left exit eye reads blocked. Watch the left lane stop after 3 s and the fault lamp latch.';
  S.faults.push(['Left exit eye blocked','active']);
  logEv('Fault injected via Factory I/O Web API: At left exit forced FALSE (read-back ✓)', 'err'); trace('fault · force At left exit','factoryio',300);
  renderPane();
  setTimeout(() => { hmi.forced = false; S.faults[S.faults.length-1][1] = 'handled'; hmi.hint = 'Fault released. Press <b>RESET</b>, then <b>START</b>.';
    logEv('Fault released · harness: handled by v2, nothing new to learn', 'meta'); touch('hmi'); touch('log'); if (tab==='hmi') paintHmi(); }, 7000 / SPEED);
}

function reqStatus(r){
  const ts = r[3].map(t => S.tests[t]);
  if (ts.some(s => s === 'fail')) return 'failed';
  if (ts.every(s => s === 'pass')) return 'verified';
  if (ts.some(s => s === 'run')) return 'testing';
  return 'untested';
}
const reqPill = s => s==='verified'?'<span class="pill go"><i></i>verified</span>':s==='failed'?'<span class="pill stop"><i></i>failed</span>':s==='testing'?'<span class="pill fl"><i></i>testing</span>':'<span class="pill nt">untested</span>';
function testsHtml(click){
  const done = Object.values(S.tests).filter(v => v==='pass'||v==='fail').length;
  return `<div class="progress"><i style="width:${done/TESTS.length*100}%"></i></div><div class="tests">${TESTS.map(([id,t,r,h]) => { const s = S.tests[id] || '';
    const c = click && !h && s && s!=='run';
    return `<div class="test ${s} ${c?'click':''} ${click&&S.selTest===id?'sel':''}" ${c?`onclick="S.selTest='${id}';renderPane()"`:''}><span class="i">${s==='pass'?'✓':s==='fail'?'✕':''}</span>
      <span>${h?`🔒 ${t}`:`<span class="id">${id}</span>${t}`}</span><span class="rq">${r}</span></div>`; }).join('')}</div>${repairHtml()}`;
}
function repairHtml(){
  if (!S.repair) return '';
  const steps = ['Diagnosing from measured samples…','Writing repair v2…','Recompiled & redeployed · retesting T6 + regression'];
  return `<div class="repair" style="margin-top:14px"><h3>Self-repair · ${S.repaired ? 'fixed in v2' : steps[S.repair-1]}</h3>
    <p>T6 measured the <span class="mono">Reset light</span> going FALSE at t = 3.10 s — the fault lamp followed the timer instead of latching.</p>
    ${S.repair >= 2 ? `<div class="diff"><div class="m">- ResetLight := JamTimer.Q;</div><div class="p">+ IF JamTimer.Q THEN FaultLeft := TRUE; END_IF;</div><div class="p">+ IF ResetBtn AND AtLeftExit THEN FaultLeft := FALSE; END_IF;</div><div class="p">+ ResetLight := FaultLeft;</div></div>` : ''}</div>`;
}

function timelineHtml(id){
  const s = S.tests[id];
  if (!s || s === 'run') return '<div class="empty" style="padding:24px">Measuring…</div>';
  const W=520,H=150,L=56,R=10,T=14,B=22, x=t=>L+(t/6)*(W-L-R), lane=i=>T+i*40, hi=i=>lane(i)+4, lo=i=>lane(i)+26;
  const step=(pts,i)=>{let d=`M${x(0)},${pts[0][1]?hi(i):lo(i)}`;for(let k=1;k<pts.length;k++)d+=` H${x(pts[k][0])} V${pts[k][1]?hi(i):lo(i)}`;return d+` H${x(6)}`;};
  let lanes, note, ok = s === 'pass';
  if (id === 'T6') lanes = [['L-exit eye',[[0,1],[1,0],[4.8,1]],'var(--sensor)'],['Conv. left',[[0,1],[4.05,0]],'var(--actuator)'],['Reset light', ok ? [[0,0],[4.05,1]] : [[0,0],[4.05,1],[4.15,0]],'#c08a00']];
  else lanes = [['Input',[[0,0],[1,1],[1.4,0]],'var(--sensor)'],['Output',[[0,0],[1.05,1]],'var(--actuator)']];
  let g = '';
  for (let t=0;t<=6;t++) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}" stroke="#ebe8e2"/><text x="${x(t)}" y="${H-6}" fill="#9aa1a8" font-size="10" font-family="Geist Mono" text-anchor="middle">${t}s</text>`;
  lanes.forEach(([n],i) => g += `<text x="${L-8}" y="${lane(i)+19}" fill="#67717b" font-size="10" font-family="Geist Mono" text-anchor="end">${n}</text>`);
  if (id === 'T6') g += `<rect x="${x(1)}" y="${T}" width="${x(4.05)-x(1)}" height="${H-B-T}" fill="#f2b01e" opacity=".1"/><text x="${(x(1)+x(4.05))/2}" y="${T-3}" fill="#9a5c00" font-size="9" font-family="Geist Mono" text-anchor="middle">eye blocked · 3.05 s</text>`;
  lanes.forEach(([n,p,c],i) => g += `<path d="${step(p,i)}" fill="none" stroke="${c}" stroke-width="2.2"/>`);
  if (id === 'T6' && !ok) g += `<circle cx="${x(4.15)}" cy="${lo(2)}" r="5" fill="none" stroke="#c0322b" stroke-width="1.8"/>`;
  note = id === 'T6' ? (ok ? 'Reset light stays TRUE while the fault is latched · measured on v2' : 'Reset light dropped at t = 3.10 s · expected latched (v1)') : 'Output followed input within 50 ms';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="note" style="color:${ok?'var(--go)':'var(--stop)'}">${ok?'✓':'✕'} ${note}</div>`;
}

    notes:['TON becomes an IEC_TIMER instance in a data block','Program becomes FB "Main" called from OB1','NC contacts (Stop, E-stop) kept as-is — check your wiring']},
  rockwell: {n:'Rockwell Studio 5000', f:'ControlLogix · L5X', file:'SortingStation.L5X', addr:(d,i)=>d==='in'?`Local:1:I.Data.${i}`:`Local:2:O.Data.${i}`,
    notes:['Structured Text routine in MainProgram / MainTask','TON becomes TONR (Rockwell ST timer); PT 3 s → PRE 3000 ms','I/O as module tags on slots 1 (DI) and 2 (DO)']},
  codesys: {n:'CODESYS 3.5', f:'PLCopen XML (IEC 61131-3)', file:'SortingStation_codesys.xml', addr:(d,i)=>d==='in'?`%IX0.${i}`:`%QX0.${i}`,
    notes:['Imports as a PLC_PRG program; standard library TON','Works for Beckhoff TwinCAT 3, WAGO, Schneider and other CODESYS-based PLCs','Map %IX/%QX to your I/O module in the device tree']},
  openplc: {n:'OpenPLC / generic', f:'IEC 61131-3 .st (as tested)', file:'main.st', addr:(d,i,a)=>a,
    notes:['Exactly the program that passed 9/9 tests','Addresses unchanged (verified map for this rig)','Runs on OpenPLC v3/v4 and any IEC 61131-3 ST compiler']},
};
let exTarget = 'siemens';
function usedIo(){
  let ii = 0, oi = 0;
  return IOBLOCK.filter(l => / AT %/.test(l)).map(l => { const [, name, addr] = l.match(/^\s*(\w+)\s+AT\s+(%Q[XW][\d.]+)/);
    const d = /%QX1[234]\./.test(addr) ? 'in' : 'out'; return {name, addr, d, idx: d==='in' ? ii++ : oi++}; });
}
function openExport(){
  if (!S.verified) return;
  const el = document.createElement('div'); el.className = 'scrim'; el.id = 'exportScrim';
  el.onclick = e => { if (e.target === el) closeExport(); };
  document.body.appendChild(el); renderExport();
}
function closeExport(){ const el = $('#exportScrim'); if (el) el.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeExport(); });
function renderExport(){
  const T = TARGETS[exTarget], io = usedIo();
  $('#exportScrim').innerHTML = `<div class="modal" role="dialog" aria-label="Export to PLC">
    <div class="mh">${ICON_EXPORT}<h2>Export to a real PLC</h2><span class="pill go"><i></i>v2 · 7/7 verified</span><button class="x" onclick="closeExport()" aria-label="Close">✕</button></div>
    <div class="mb">
      <p class="lbl">Target platform</p>
      <div class="targets">${Object.entries(TARGETS).map(([k,t]) => `<button class="tg ${exTarget===k?'on':''}" onclick="exTarget='${k}';renderExport()"><div class="n">${t.n}</div><div class="f">${t.f}</div></button>`).join('')}</div>
      <p class="lbl">What's in the export</p>
      <ul class="incl"><li>Program v2 (the version that passed every test)</li><li>13 I/O tags with comments and polarity notes</li>
        <li>Requirement ↔ code traceability as comments (R1–R7)</li><li>Test evidence summary (9/9, run job_8c12)</li>${T.notes.map(n => `<li>${n}</li>`).join('')}</ul>
      <p class="lbl">I/O address remapping</p>
      <div class="card" style="box-shadow:none;max-height:240px;overflow:auto"><table><thead><tr><th>Tag</th><th>Tested on (OpenPLC)</th><th>${T.n}</th></tr></thead><tbody>${
        io.map(v => `<tr><td class="m" style="color:var(--ink)">${v.name}</td><td class="m">${v.addr}</td><td class="m" style="color:var(--leaf);font-weight:600">${T.addr(v.d, v.idx, v.addr)}</td></tr>`).join('')}</tbody></table></div>
      ${exTarget==='openplc' ? '' : `<div class="warnbox"><b>Before running on hardware:</b> the logic is verified in simulation only. Match the addresses to your real I/O modules, then do a dry run with outputs disabled and a site acceptance test. Never skip the safety circuit — E-stop must also be hard-wired.</div>`}
    </div>
    <div class="mf"><span class="fn">${T.file} · ${(exportText().length/1024).toFixed(1)} KB</span>
      <span class="r"><button class="btn sm" onclick="copyExport()" id="copyBtn">Copy code</button><button class="btn pri sm" onclick="downloadExport()">${ICON_EXPORT} Download</button></span></div>
  </div>`;
}
function remappedCode(){
  const T = TARGETS[exTarget], map = Object.fromEntries(usedIo().map(v => [v.addr, T.addr(v.d, v.idx, v.addr)]));
  return S.code.map(l => l.t.replace(/%Q[XW][\d.]+/g, a => map[a] || a)).join('\n');
}
function exportText(){
  const T = TARGETS[exTarget], code = remappedCode(), esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const head = `MongoMation export (MOCK) · project prj_8c12 · program v2 · 7/7 requirements verified on Factory I/O · target ${T.n}`;
  if (exTarget === 'openplc') return `(* ${head} *)\n${code}\n`;
  if (exTarget === 'rockwell') return `<?xml version="1.0" encoding="UTF-8"?>\n<!-- ${head} -->\n<RSLogix5000Content SchemaRevision="1.0" TargetName="SortingStation" TargetType="Program">\n <Controller Use="Context" Name="MongoMation">\n  <Programs><Program Name="MainProgram" MainRoutineName="Main">\n   <Routines><Routine Name="Main" Type="ST"><STContent>\n${code.split('\n').map((l,i)=>`    <Line Number="${i}"><![CDATA[${l}]]></Line>`).join('\n')}\n   </STContent></Routine></Routines>\n  </Program></Programs>\n </Controller>\n</RSLogix5000Content>\n`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<!-- ${head} -->\n<project xmlns="http://www.plcopen.org/xml/tc6_0201">\n <fileHeader companyName="MongoMation" productName="MongoMation" productVersion="mock" creationDateTime="${new Date().toISOString()}"/>\n <types><pous>\n  <pou name="${exTarget==='codesys'?'PLC_PRG':'Main'}" pouType="${exTarget==='codesys'?'program':'functionBlock'}">\n   <body><ST><xhtml xmlns="http://www.w3.org/1999/xhtml">\n${esc(code)}\n   </xhtml></ST></body>\n  </pou>\n </pous></types>\n</project>\n`;
}
function downloadExport(){
  const blob = new Blob([exportText()], {type: exTarget==='openplc' ? 'text/plain' : 'application/xml'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = TARGETS[exTarget].file; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  logEv(`Exported program v2 for ${TARGETS[exTarget].n} (${TARGETS[exTarget].file})`);
}
function copyExport(){
  navigator.clipboard?.writeText(remappedCode()).then(() => { const b = $('#copyBtn'); if (b){ b.textContent = 'Copied ✓'; setTimeout(() => b && (b.textContent = 'Copy code'), 1200); } }).catch(() => {});
}

/* ================= run orchestration ================= */
function logEv(m, l){ const d = new Date(); S.events.push([d.toTimeString().slice(0,8), m, l]); touch('log'); }
function trace(name, who, ms, err){ S.traces.push({name, who, ms, err}); if (tab === 'log' && logSub === 'traces') renderPane(); }
function newSpec(){ RUN++; PAUSED = false; S = fresh(); hmi.running = false; hmi.fault = false; hmi.forced = false; hmi.count = 0; hmi.box = null;
  unlocked.clear(); unlocked.add('build'); Object.keys(dots).forEach(k => delete dots[k]); setFollow(true); tab = 'build'; renderTabs(); renderRunbar(); renderPane(); }
function interrupt(){ PAUSED = true; $('#lampWorker').className = 'lamp bad'; const i = S.status.findIndex(s => s==='active'||s==='warn');
  logEv(`Worker wkr-plc-01 exited 137 during "${STEPS[i]}" — no cleanup`, 'err'); renderRunbar(); renderPane(); }
function resume(){ PAUSED = false; S.resumed++; $('#lampWorker').className = 'lamp';
  const n = S.status.filter(s => s==='done').length;
  logEv('Worker restarted · job_8c12 recovered (resumedFrom attempt 1)'); logEv(`Reused ${n} stage checkpoint(s) from Atlas; only the interrupted stage re-runs`, 'meta');
  renderRunbar(); renderPane(); }

async function startRun(text){
  const my = ++RUN, ok = () => my === RUN;
  S = fresh(); S.started = true; hmi.count = 0;
  $('#specq').textContent = text; setFollow(true);
  unlock('program'); unlock('log'); unlock('harness'); dots.program = dots.log = dots.harness = null;
  S.cur = 0; setStep(0,'active','requirements'); tab = 'build'; renderTabs(); renderPane();
  logEv('Job job_8c12 queued · claimed by wkr-plc-01'); trace('agent · requirements','claude-opus-5-5',1900);

  for (const r of REQS){ await sleep(360); if(!ok())return; S.reqs.push(r); if (tab==='build') renderPane(); }
  logEv('7 requirements extracted (2 safety)');
  setStep(0,'active','binding I/O'); await sleep(600); if(!ok())return; trace('agent · scene binder','claude-sonnet-5-5',800);
  S.code.push({t:'PROGRAM Main'}); IOBLOCK.forEach(t => S.code.push({t, c:'hw'})); paintCode(); touch('program');
  logEv('Harness wrote 13 located variables from the verified I/O map');
  setStep(0,'active','writing logic'); await sleep(500); if(!ok())return; trace('agent · codegen','claude-opus-5-5',3400);
  for (const t of LOGIC){ S.code.push({t:''});
    for (let c = 0; c <= t.length; c += 3){ if(!ok())return; S.code[S.code.length-1].t = t.slice(0,c); paintCode(true); await sleep(13); }
    S.code[S.code.length-1].t = t; }
  S.v1 = S.code.length; paintCode(); logEv(`Codegen v1 · ${S.code.length} lines`); setStep(0,'done',`v1 · ${S.code.length} lines`);
  await sleep(700); if(!ok())return;

  S.cur = 1; setStep(1,'active','preflight'); live('build'); if (tab==='build') renderPane();
  const lines = [['dim','$ preflight  iec2c (MatIEC) main.st'],['ok','✓ static checks: inputs never written · every output assigned · no WHILE'],['ok','✓ MatIEC preflight ok (1.4 s)'],
    ['dim','$ build  STruC++ 0.7.0 → program.zip (+ conf/modbus_slave.json)'],['','  compiling Config0 / Res0 / Main …'],['ok','✓ g++ build ok (38.2 s)'],
    ['dim','$ upload  POST https://10.42.1.20:8443/api/upload-file'],['hi','  runtime restarted · waiting for Modbus :502'],['ok','✓ PLC status RUNNING · program sha 9e1c…'],['ok','✓ Factory I/O reconnected (watchdog)']];
  const ph = [0,0,0,1,1,1,2,2,2,3], dn = {2:1,5:2,8:3,9:4};
  for (let j = 0; j < lines.length; j++){ await sleep(j===4?1200:400); if(!ok())return; S.term.push(lines[j]); S.chainAt = ph[j]; if (dn[j]) S.chainDone = dn[j];
    setStep(1,'active',['preflight','compiling','deploying','connecting'][ph[j]]); if (tab==='build' || (tab==='program' && progSub==='compile')) renderPane(); }
  trace('tool · preflight','MatIEC',1400); trace('tool · compile','STruC++',38200); trace('tool · deploy','OpenPLC REST',6100);
  logEv('OpenPLC RUNNING · Factory I/O connected'); setStep(1,'done','RUNNING'); await sleep(700); if(!ok())return;

  S.cur = 2; S.hmiStep = 0; setStep(2,'active','process mimic'); unlock('hmi'); live('hmi'); touch('build'); touch('hmi');
  for (let j = 0; j < HMI_PARTS.length; j++){ S.hmiStep = j; setStep(2,'active',HMI_PARTS[j][1]); touch('hmi'); touch('build');
    await sleep(900); if(!ok())return; S.hmiBuilt = j+1; if (tab==='hmi') AFTER.hmi(); }
  S.hmiStep = HMI_PARTS.length; trace('agent · hmi builder','claude-sonnet-5-5',2600); logEv('HMI generated · 24 tags bound');
  setStep(2,'done','24 tags'); touch('hmi'); touch('build'); await sleep(1200); if(!ok())return;

  S.cur = 3; setStep(3,'active','0 / 9'); unlock('verify'); live('verify'); touch('build');
  for (let j = 0; j < TESTS.length; j++){
    const id = TESTS[j][0]; S.tests[id] = 'run'; setStep(3,'active',`${j} / 9`); touch('verify'); touch('build');
    await sleep(620); if(!ok())return;
    S.tests[id] = id === 'T6' ? 'fail' : 'pass'; trace(`test · ${id}`,'factoryio',4000+j*300,id==='T6');
    if (id === 'T6'){ logEv('T6 failed: Reset light dropped at t = 3.10 s, expected latched','err'); touch('verify','red'); } else touch('verify');
    touch('build');
  }
  setStep(3,'warn','repairing T6'); S.repair = 1; touch('verify'); touch('build');
  trace('agent · diagnosis','claude-opus-5-5',2100); await sleep(1600); if(!ok())return;
  S.repair = 2; touch('verify'); touch('build'); trace('agent · repair','claude-opus-5-5',2900);
  S.code = S.code.filter(l => !/ResetLight := JamTimer.Q|ConveyorLeft  := Running AND NOT JamTimer.Q/.test(l.t));
  { const at = S.code.findIndex(l => l.t.startsWith('JamTimer(')) + 1;
    S.code.splice(at, 0, ...['IF JamTimer.Q THEN FaultLeft := TRUE; END_IF;','IF ResetBtn AND AtLeftExit THEN FaultLeft := FALSE; END_IF;','ResetLight := FaultLeft;'].map(t => ({t, c:'add'})));
    S.code.splice(S.code.findIndex(l => l.t.startsWith('ConveyorEntry')) + 1, 0, {t:'ConveyorLeft  := Running AND NOT FaultLeft;', c:'add'});
    S.code.splice(S.code.findIndex(l => l.t.startsWith('  JamTimer')) + 1, 0, {t:'  FaultLeft : BOOL;', c:'add'}); }
  touch('program'); logEv('Repair v2: latch FaultLeft, clear on Reset ∧ eye clear · recompiled · redeployed');
  await sleep(1600); if(!ok())return;
  S.repair = 3; S.tests.T6 = 'run'; S.tests.H2 = 'run'; setStep(3,'active','retesting'); touch('verify'); touch('build');
  await sleep(1100); if(!ok())return;
  S.tests.T6 = 'pass'; S.tests.H2 = 'pass'; S.repaired = true; S.newLesson = true; trace('test · T6 (v2)','factoryio',4300);
  logEv('All 9 tests passed on v2'); logEv('Lesson stored: fault lamps must latch', 'meta'); setStep(3,'done','9 / 9'); touch('verify'); touch('log','me');
  await sleep(1300); if(!ok())return;

  S.cur = 4; S.verified = true; setStep(4,'done','7 / 7'); logEv('Project verified · 7/7 requirements with measured evidence');
  live('build'); touch('build'); touch('hmi'); touch('harness','me');
}

renderTabs(); renderPane();
/* opened from the control room: ?cab=CAB-01&ex=sorting preloads that cabinet's machine spec */
(() => { const q = new URLSearchParams(location.search), ex = q.get('ex'), cab = q.get('cab');
  if (cab) document.title = `${cab} · MongoMation PLC`;
  if (ex) { const b = document.querySelector(`[data-ex="${ex}"]`); if (b) b.click(); } })();
</script>
