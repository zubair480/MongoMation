<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLC Macro</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#ffffff 0%,#f4f5f7 70%,#eceef1 100%);color:#0B0B0C;font:14px/1.4 Geist,system-ui,sans-serif}
#plc{position:fixed;inset:0}
.bar{position:fixed;left:20px;bottom:20px;display:flex;gap:2px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid #E7E7E9;border-radius:6px;padding:4px;box-shadow:0 6px 24px rgba(16,24,40,.06);flex-wrap:wrap;max-width:calc(100vw - 40px)}
.bar button{font:500 12px "Geist Mono",monospace;border:0;background:none;padding:8px 11px;border-radius:4px;cursor:pointer;color:#0B0B0C}
.bar button:hover{background:#F3F4F6}.bar button.on{background:#0B0B0C;color:#fff}
.hud{position:fixed;left:20px;top:18px;font:500 11px "Geist Mono",monospace;letter-spacing:.06em;color:#8A8F98}
.hud b{color:#0B0B0C;font-weight:500}
</style></head><body>
<div id="plc"></div>
<div class="hud"><b>MM-1214</b> · SORTING BY HEIGHT (BASIC) · <span id="perf">measuring…</span></div>
<div class="bar" id="bar">
  <button data-a="run" class="on">RUN</button><button data-a="stop">STOP</button><button data-a="fault">FAULT</button><button data-a="deploy">DEPLOY</button>
  <button data-a="force">FORCE</button><button data-a="pulse">PULSE</button>
  <button data-f="-1">ALL</button><button data-f="CPU">CPU</button><button data-f="DI">DI</button><button data-f="DO">DO</button><button data-f="AI">AI</button>
</div>
<script type="module">
import { createPLC, INPUTS, OUTPUTS } from './plcmacro.js?v=2';
const plc = window.PLC = createPLC(document.getElementById('plc'), { analog: ['Height', null, null, null] });
plc.setState({ mode: 'RUN', version: '1.4.2', scanMs: 4.2, deploying: false });

// fake IO ticker: simple sorting cycle
const tags = Object.fromEntries([...INPUTS, ...OUTPUTS].map(([n]) => [n, false]));
tags.Auto = true; tags['Stop'] = true; tags['Emergency stop'] = true; tags.Height = 0;
let forced = [], step = 0, mode = 'RUN';
setInterval(() => {
  if (mode !== 'RUN') { plc.setIO({ tags, forced }); return; }
  step = (step + 1) % 24;
  const tall = Math.floor(step / 24 * 2) % 2 === 0;
  tags['Conveyor entry'] = step < 10;
  tags['Pallet sensor'] = step >= 3 && step < 9;
  tags['High sensor'] = tags['Pallet sensor'] && step % 2 === 0;
  tags['Low sensor'] = tags['Pallet sensor'];
  tags['Load'] = step >= 9 && step < 12; tags['Loaded'] = step >= 11 && step < 16;
  tags['Transf. left'] = step >= 12 && step < 16 && step % 4 < 2; tags['Transf. right'] = step >= 12 && step < 16 && step % 4 >= 2;
  tags['Unload'] = step >= 15 && step < 18;
  tags['Conveyor left'] = step >= 16 && step < 22; tags['Conveyor right'] = step >= 16 && step < 22 && step % 3 === 0;
  tags['At left entry'] = step === 17 || step === 18; tags['At left exit'] = step === 21;
  tags['At right entry'] = step === 18; tags['At right exit'] = step === 22;
  tags['Start light'] = true; tags['Stop light'] = false; tags['Reset light'] = step % 6 < 3 && false;
  tags.Height = tags['Pallet sensor'] ? +(4.2 + Math.random() * 1.5).toFixed(2) : 0;
  plc.setIO({ tags, forced });
  plc.setState({ scanMs: +(3.8 + Math.random() * 0.9).toFixed(1) });
}, 450);

document.getElementById('bar').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { plc.focusModule(b.dataset.f === '-1' ? -1 : b.dataset.f); return; }
  const a = b.dataset.a;
  if (a === 'run' || a === 'stop' || a === 'fault') { mode = a.toUpperCase(); plc.setState({ mode, deploying: false });
    document.querySelectorAll('[data-a=run],[data-a=stop],[data-a=fault]').forEach((x) => x.classList.toggle('on', x === b)); }
  if (a === 'deploy') { plc.setState({ deploying: true }); b.classList.add('on');
    setTimeout(() => { plc.setState({ deploying: false, version: '1.4.' + (3 + Math.floor(Math.random() * 7)), mode: 'RUN' }); mode = 'RUN'; b.classList.remove('on'); }, 5000); }
  if (a === 'force') { forced = forced.length ? [] : ['Stop light', 'Low sensor']; tags['Stop light'] = forced.length > 0; b.classList.toggle('on', forced.length > 0); plc.setIO({ tags, forced }); }
  if (a === 'pulse') plc.pulse('Conveyor entry');
};
setTimeout(() => { const r = plc.measure(5); document.getElementById('perf').textContent = `${r.msPerRender} ms/render · ${r.drawCalls} draws · ${(r.triangles / 1000).toFixed(0)}k tris`; }, 1500);
</script>
</body></html>
